[package]
name = "dailycrm"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
actix-cors = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "json"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
bcrypt = "0.19.1"
serde_json = "1"
opendal = { version = "0.59", features = ["services-s3"] }
actix-multipart = "0.8.0"
actix-governor = "0.10.0"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
infer = "0.22.0"
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-appender = "0.2"
tracing-actix-web = "0.7"
bytes = "1.11.1"
cron = "0.17.0"
tokio = { version = "1", features = ["sync", "time"] }
moka = { version = "0.12", features = ["future"] }
rust_decimal = { version = "1.43.0", features = ["serde", "db-postgres"] }