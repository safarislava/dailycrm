name: "Code Quality & Security Scan"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze-js:
    name: CodeQL Scan (JS/TS Frontend)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: 'results'

      - name: Save JS Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-sarif-results
          path: results/*.sarif

  analyze-rust:
    name: Clippy Quality Scan (Rust Backend)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backend

      - name: Install clippy-sarif & sarif-fmt
        uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run Clippy and generate SARIF & JSON
        run: |
          cd Backend
          cargo clippy --message-format=json > clippy_results.json || true
          clippy-sarif < clippy_results.json > rust-clippy.sarif || true

      - name: Upload Rust SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: Backend/rust-clippy.sarif
        continue-on-error: true

      - name: Save Rust Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-clippy-results
          path: Backend/clippy_results.json

  report:
    name: Post Unified Quality Comment
    needs: [ analyze-js, analyze-rust ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Download JS Results
        uses: actions/download-artifact@v4
        with:
          name: js-sarif-results
          path: js-results
        continue-on-error: true

      - name: Download Rust Results
        uses: actions/download-artifact@v4
        with:
          name: rust-clippy-results
          path: rust-results
        continue-on-error: true

      - name: Post Unified Quality Report to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Parse JS SARIF Results
            let jsIssuesCount = 0;
            const jsDir = './js-results';
            if (fs.existsSync(jsDir)) {
              const files = fs.readdirSync(jsDir).filter(f => f.endsWith('.sarif'));
              for (const file of files) {
                try {
                  const content = JSON.parse(fs.readFileSync(path.join(jsDir, file), 'utf8'));
                  const runs = content.runs || [];
                  for (const run of runs) {
                    jsIssuesCount += (run.results || []).length;
                  }
                } catch (e) {}
              }
            }

            // Parse Rust Clippy Results
            let rustWarningsCount = 0;
            const rustFile = './rust-results/clippy_results.json';
            if (fs.existsSync(rustFile)) {
              try {
                const lines = fs.readFileSync(rustFile, 'utf8').split('\n');
                for (const line of lines) {
                  if (!line.trim()) continue;
                  try {
                    const msg = JSON.parse(line);
                    if (msg.reason === 'compiler-message' && msg.message && msg.message.level === 'warning') {
                      rustWarningsCount++;
                    }
                  } catch (e) {}
                }
              } catch (e) {}
            }

            const jsIcon = jsIssuesCount === 0 ? '✅' : '⚠️';
            const rustIcon = rustWarningsCount === 0 ? '✅' : '⚠️';
            const totalIssues = jsIssuesCount + rustWarningsCount;
            const overallIcon = totalIssues === 0 ? '✅' : '⚠️';

            let summary = `### ${overallIcon} Code Quality & Security Report\n\n`;
            summary += `| Component | Engine | Status | Issues / Warnings |\n`;
            summary += `|---|---|---|---|\n`;
            summary += `| **Frontend (JS/TS)** | CodeQL | ${jsIcon} | \`${jsIssuesCount}\` |\n`;
            summary += `| **Backend (Rust)** | Clippy | ${rustIcon} | \`${rustWarningsCount}\` |\n\n`;

            if (totalIssues === 0) {
              summary += `✨ **All checks passed cleanly! No security or code quality issues detected in Frontend or Backend.**`;
            } else {
              summary += `⚠️ **Found ${totalIssues} issue(s) in total across project components.** Please review the workflow logs and Security tab.`;
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (err) {
              console.log('Error posting PR comment:', err);
            }
